<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backyard Book – live fixtures</title>
<style>
:root{--bg:#E6ECF3;--ink:#0E1A2B;--muted:#5A6A80;--card:#fff;--line:#CBD5E1;--red:#D62839;--gold:#FFC53D;--green:#1B9E5A;--navy:#12233D;--soft:#F4F7FB}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
input,select{font:inherit;font-size:16px;width:100%;padding:11px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:disabled{background:#EDF1F6;color:#8493A8}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.banner{background:var(--gold);font-size:12.5px;font-weight:700;text-align:center;padding:7px 12px}
.status{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.status button{font-weight:700;text-decoration:underline;color:var(--ink)}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--navy)}
.authbox{background:#fff;border-radius:18px;max-width:400px;width:100%;overflow:hidden}
.authtop{background:var(--red);color:#fff;padding:22px}
.brand{font-weight:900;font-size:26px;letter-spacing:-.03em}.brand span{color:var(--gold)}
.authtop p{font-size:14px;margin-top:4px}
.authbody{padding:20px;display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button,.mode button{padding:9px;border-radius:8px;font-weight:700;font-size:14px;background:#E6ECF3}
.seg button[aria-pressed=true],.mode button[aria-pressed=true]{background:var(--ink);color:#fff}
label.l{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.chk{display:flex;gap:8px;font-size:13px;align-items:flex-start}.chk input{width:auto;margin-top:3px}
.btn{width:100%;padding:13px;border-radius:10px;background:var(--red);color:#fff;font-weight:800;font-size:16px}
.btn:disabled{background:#B7C0CD}.btn.dark{background:var(--ink)}.btn.gold{background:var(--gold);color:var(--ink)}
.ghost{padding:9px 14px;border:2px solid var(--ink);border-radius:8px;font-weight:700;font-size:13px}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px}
header .brand{font-size:20px;flex:1}
.bal{text-align:right;line-height:1.1;cursor:pointer}.bal small{display:block;font-size:11px;color:#9FB1C9}
.bal b{font-size:19px;color:var(--gold);font-variant-numeric:tabular-nums}
.dep{background:#5B6B83;color:#fff;font-weight:800;padding:9px 14px;border-radius:999px;font-size:14px}
.dep.on{background:var(--green)}
nav{background:#fff;display:flex;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:19}
nav button{flex:none;padding:13px 16px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:4px solid transparent}
nav button[aria-current=page]{color:var(--ink);border-color:var(--red)}
.wrap{max-width:1080px;margin:0 auto;padding:16px;display:grid;gap:20px}
@media(min-width:900px){.wrap.two{grid-template-columns:1fr 350px;align-items:start}body{padding-bottom:24px}}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:10px}
h4{font-size:13px;color:var(--muted);margin:16px 0 8px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin:10px 0 4px}
.chip{flex:none;padding:6px 14px;border:2px solid var(--ink);border-radius:999px;font-weight:700;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.event{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border-left:6px solid var(--navy)}
.event.live{border-color:var(--red)}.event.ft{border-color:#9AA8BA}
.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.livetag{color:var(--red);font-weight:800}
.teams{display:grid;gap:6px;margin-bottom:6px}
.tm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.tm img{width:24px;height:24px;object-fit:contain}.tm .sc{margin-left:auto;font-size:20px;font-variant-numeric:tabular-nums}
.odds{display:grid;gap:8px;grid-template-columns:repeat(var(--n),1fr);margin-top:8px}
.odd{border:2px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;background:var(--soft)}
.odd span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odd b{font-size:19px;font-variant-numeric:tabular-nums}
.odd[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.odd[aria-pressed=true] span{color:#C7D3E3}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#E6ECF3;color:var(--muted)}
.tag.feed{background:#CDEFDD;color:#0C5E34}
.closed{font-size:13px;color:var(--muted);margin-top:6px}
.slip{background:var(--card);border-radius:16px;overflow:hidden}
.slip-head{background:var(--red);color:#fff;padding:12px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.slip-body{padding:14px 16px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.leg{border-bottom:1px dashed var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.leg .pick{font-weight:700}.leg .ev{font-size:12px;color:var(--muted)}.leg .px{font-weight:800;font-variant-numeric:tabular-nums}
.leg .x{grid-row:1;grid-column:2;text-align:right;font-size:12px;color:var(--red);font-weight:700}
.leg input{grid-column:1/-1;margin-top:6px}
.quick{display:flex;gap:6px;margin:8px 0}.quick button{flex:1;padding:6px;border-radius:8px;background:#E6ECF3;font-weight:700;font-size:13px}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
@media(max-width:899px){
 .slip{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:16px 16px 0 0;max-height:82vh;overflow:auto;transform:translateY(calc(100% - 52px));transition:transform .25s;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
 .slip.open{transform:none}.slip-head{position:sticky;top:0;min-height:52px}}
@media(min-width:900px){.slip{position:sticky;top:120px}.slip-head button{display:none}}
@media(prefers-reduced-motion:reduce){.slip{transition:none}.spin{animation-duration:3s}}
.bet{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border-left:6px solid var(--gold)}
.bet.won{border-color:var(--green)}.bet.lost{border-color:var(--red)}.bet.void{border-color:#9AA8BA}
.bet .top{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px}
.st{font-size:12px;padding:2px 10px;border-radius:999px;background:#E6ECF3;font-weight:700}
.st.won,.st.completed{background:#CDEFDD;color:#0C5E34}.st.lost,.st.cancelled{background:#F8D3D7;color:#8A1320}
.st.pending{background:#FFF1C7;color:#7A5600}
.bet li{list-style:none;font-size:14px;padding:3px 0}.bet li small{color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:14px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.stat{background:var(--navy);color:#fff;border-radius:14px;padding:14px}.stat small{color:#9FB1C9;font-size:12px}
.stat b{display:block;font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
.stat.alt{background:#fff;color:var(--ink)}.stat.alt small{color:var(--muted)}.stat.alt b{color:var(--ink)}
.methods{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:12px}
.method{border:2px solid var(--line);border-radius:10px;padding:10px;text-align:left;background:var(--soft)}
.method b{display:block;font-size:14px}.method small{color:var(--muted);font-size:12px}
.method[aria-pressed=true]{border-color:var(--ink);background:#fff}.method:disabled{opacity:.55}
.lock{background:#12233D;color:#fff;border-radius:12px;padding:14px;margin-bottom:14px;font-size:14px}
.lock b{color:var(--gold)}
.lock button{margin-top:10px;background:var(--gold);color:var(--ink);font-weight:800;padding:9px 14px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);padding:6px 4px;border-bottom:2px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}.tx-wrap{overflow-x:auto}
.ov{position:fixed;inset:0;background:rgba(14,26,43,.6);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center}
.modal h3{margin-bottom:8px}.modal p{font-size:14px;color:var(--muted);margin-bottom:10px}
.spin{width:44px;height:44px;border:5px solid #E6ECF3;border-top-color:var(--red);border-radius:50%;margin:10px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tick{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;display:grid;place-items:center;margin:6px auto 10px}
.receipt{background:var(--soft);border-radius:10px;padding:10px 12px;text-align:left;font-size:14px;margin:10px 0}
.receipt div{display:flex;justify-content:space-between;padding:2px 0;gap:10px}
.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
.toast.on{opacity:1}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
footer{max-width:1080px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div id="auth">
 <div class="authbox">
  <div class="authtop"><div class="brand">Backyard<span>Book</span></div><p>Live fixtures. Free-play betting while we complete licensing.</p></div>
  <div class="authbody">
   <div class="seg"><button id="a-up" aria-pressed="true">Sign up</button><button id="a-in" aria-pressed="false">Log in</button></div>
   <div id="f-name"><label class="l" for="name">Display name</label><input id="name" autocomplete="nickname" placeholder="e.g. Sam"></div>
   <div><label class="l" for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
   <div><label class="l" for="pw">Password</label><input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
   <label class="chk" id="f-age"><input type="checkbox" id="age"> I am 18 or older (or the legal age where I live) and I accept the Terms and Privacy Policy.</label>
   <div class="err" id="autherr" role="alert"></div>
   <button class="btn" id="authgo">Create account</button>
   <p class="note">Accounts are held in this browser tab only until a backend is connected (see setup notes).</p>
  </div>
 </div>
</div>

<div id="app" hidden>
 <div class="banner" id="banner"></div>
 <header>
  <div class="brand">Backyard<span>Book</span></div>
  <div class="bal" id="hbal" role="button" tabindex="0" aria-label="Open wallet"><small id="ballbl">Free-play</small><b id="balv"></b></div>
  <button class="dep" id="hdep">Deposit</button>
 </header>
 <nav id="nav"><button data-v="fixtures">Fixtures</button><button data-v="live">Live</button><button data-v="bets">My bets <span id="pc"></span></button><button data-v="wallet">Wallet</button><button data-v="account">Account</button></nav>
 <div class="wrap" id="wrap">
  <main id="view"></main>
  <aside class="slip" id="slip" aria-label="Bet slip">
   <div class="slip-head"><span>Bet slip <span id="cnt"></span></span><button id="toggle" aria-expanded="false" style="color:#fff;font-weight:700">Open</button></div>
   <div class="slip-body">
    <div class="mode"><button id="m-single" aria-pressed="true">Singles</button><button id="m-parlay" aria-pressed="false">Parlay</button></div>
    <div id="legs"></div>
    <div id="parlayBox" hidden><label class="l" for="pstake">Stake</label><input type="number" id="pstake" min="1" inputmode="decimal" placeholder="e.g. 20">
     <div class="quick" data-q="p"><button data-add="5">+5</button><button data-add="20">+20</button><button data-add="50">+50</button><button data-add="max">Max</button></div></div>
    <div class="sum"><span>Total stake</span><b id="tot"></b></div>
    <div class="sum"><span>Possible return</span><b id="pay"></b></div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="place" disabled>Place bet</button>
   </div>
  </aside>
 </div>
 <footer id="foot"></footer>
</div>
<div id="modal"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= CONFIG ================= */
const CONFIG={
 PAYMENTS_ENABLED:false,      // flip to true only after you hold a gaming licence and have a processor connected
 TSDB_KEY:"3",                // free test key. Get your own at thesportsdb.com (needed for production traffic)
 TSDB_V2_KEY:"",              // TheSportsDB premium key: enables live scores
 ODDS_API_KEY:"",             // the-odds-api.com key: enables real bookmaker odds
 FREEPLAY_START:1000,
 MIN_DEP:5,MAX_DEP:5000,MIN_WD:10,
 hooks:{ // connect your licensed payment processor + KYC provider here (server-side calls recommended)
  deposit:null,   // async ({amount,method}) => ({ref})
  withdraw:null,  // async ({amount,method,dest}) => ({ref})
  verify:null     // async () => true
 }
};
const LEAGUES=[
 {id:4328,n:"Premier League",sp:"Soccer",ok:"soccer_epl"},
 {id:4335,n:"La Liga",sp:"Soccer",ok:"soccer_spain_la_liga"},
 {id:4331,n:"Bundesliga",sp:"Soccer",ok:"soccer_germany_bundesliga"},
 {id:4332,n:"Serie A",sp:"Soccer",ok:"soccer_italy_serie_a"},
 {id:4334,n:"Ligue 1",sp:"Soccer",ok:"soccer_france_ligue_one"},
 {id:4480,n:"Champions League",sp:"Soccer",ok:"soccer_uefa_champs_league"},
 {id:4387,n:"NBA",sp:"Basketball",ok:"basketball_nba"},
 {id:4380,n:"NHL",sp:"Ice Hockey",ok:"icehockey_nhl"},
 {id:4424,n:"MLB",sp:"Baseball",ok:"baseball_mlb"},
 {id:4391,n:"NFL",sp:"American Football",ok:"americanfootball_nfl"},
];
const DAY_SPORTS=["Soccer","Basketball","Ice_Hockey","Baseball","American_Football"];
const SPORT_LABEL={"Soccer":"Football","Ice Hockey":"Hockey","American Football":"American football"};
const sportLabel=s=>SPORT_LABEL[s]||s;
const TSDB="https://www.thesportsdb.com/api/v1/json/"+CONFIG.TSDB_KEY;

/* ================= STATE ================= */
const EV={};            // idEvent -> event
const RES={};           // idEvent -> "H"|"D"|"A"|"V"
let feed={ok:false,at:null,loading:false,sample:false,odds:"indicative"};
const fresh=()=>({user:null,bal:CONFIG.PAYMENTS_ENABLED?0:CONFIG.FREEPLAY_START,limit:1000,depToday:0,kyc:false,cooloff:false,
 sel:[],mode:"single",bets:[],tx:[],nid:1,tid:1,view:"fixtures",filter:"All",q:"",wtab:"deposit",dm:"card",wm:"bank",txf:"All",stakes:{},pstake:"",waitlist:false});
let S=fresh(),accounts=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=n=>Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const $$=n=>(CONFIG.PAYMENTS_ENABLED?"$":"FP ")+num(n);
const ref=p=>p+Math.random().toString(36).slice(2,8).toUpperCase();
const clock=()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2600)}
function addTx(o){const t={id:S.tid++,time:clock(),status:"completed",...o};S.tx.unshift(t);return t}

/* ================= DATA LAYER ================= */
async function getJSON(url,headers){
 const c=new AbortController(),to=setTimeout(()=>c.abort(),12000);
 try{const r=await fetch(url,{headers,signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}
 finally{clearTimeout(to)}
}
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h};
function indicative(home,away,draw){
 let h=(50+hash(home)%50)*1.12,a=50+hash(away)%50,pd=draw?.26:0;
 const ph=(1-pd)*h/(h+a),pa=(1-pd)*a/(h+a),m=1.07,o=p=>Math.max(1.05,Math.round(100/(p*m))/100);
 return draw?{H:o(ph),D:o(pd),A:o(pa)}:{H:o(ph),A:o(pa)};
}
function parseEvent(r){
 if(!r||!r.idEvent||!r.strHomeTeam||!r.strAwayTeam)return null;
 let ts=r.strTimestamp||(r.dateEvent&&r.strTime?r.dateEvent+"T"+r.strTime:null);
 if(!ts)return null;if(!/Z|[+-]\d\d:?\d\d$/.test(ts))ts+="Z";
 const start=Date.parse(ts);if(isNaN(start))return null;
 const sp=r.strSport||"Soccer",sc=v=>(v===null||v===undefined||v==="")?null:Number(v);
 return {id:String(r.idEvent),sport:sp,league:r.strLeague||"",home:r.strHomeTeam,away:r.strAway||r.strAwayTeam,start,
  hs:sc(r.intHomeScore),as:sc(r.intAwayScore),status:r.strStatus||"",progress:"",hb:r.strHomeTeamBadge||"",ab:r.strAwayTeamBadge||""};
}
function upsert(p){
 if(!p)return;const old=EV[p.id],draw=p.sport==="Soccer";
 const e=Object.assign({},old||{},p);
 if(old){["hs","as"].forEach(k=>{if(p[k]===null&&old[k]!==null)e[k]=old[k]})}
 if(!e.odds||e.src!=="feed")e.odds=indicative(e.home,e.away,draw),e.src="indicative";
 e.title=e.home+" vs "+e.away;e.draw=draw;EV[e.id]=e;
}
const isFinished=e=>/^(FT|AET|PEN|AP|Match Finished|Finished|Final|After|Full)/i.test(e.status)||(e.hs!==null&&e.as!==null&&Date.now()-e.start>3.5*3600e3);
const isVoid=e=>/Postponed|Cancelled|Canceled|Abandoned|Suspended/i.test(e.status);
const liveWindow=e=>e.sport==="Soccer"?2.75*3600e3:4*3600e3;
function phase(e){
 if(isVoid(e))return"void";if(isFinished(e))return"ft";
 const d=Date.now()-e.start;if(d>=0&&d<liveWindow(e))return"live";if(d>=liveWindow(e))return"ft";return"up";
}
async function loadFixtures(){
 if(feed.loading)return;feed.loading=true;paintStatus();
 const day=new Date().toISOString().slice(0,10),tasks=[];
 LEAGUES.forEach(l=>tasks.push(getJSON(`${TSDB}/eventsnextleague.php?id=${l.id}`).then(j=>(j.events||[]).forEach(r=>upsert(parseEvent(r))))));
 DAY_SPORTS.forEach(s=>tasks.push(getJSON(`${TSDB}/eventsday.php?d=${day}&s=${s}`).then(j=>(j.events||[]).forEach(r=>upsert(parseEvent(r))))));
 const r=await Promise.allSettled(tasks);const ok=r.filter(x=>x.status==="fulfilled").length;
 if(ok===0&&!Object.keys(EV).length)loadSample();
 else feed.sample=false;
 feed.ok=ok>0;feed.at=new Date();feed.loading=false;
 if(CONFIG.ODDS_API_KEY)await loadOdds();
 if(CONFIG.TSDB_V2_KEY)await loadLive();
 pruneSlip();paintStatus();rerender();
}
function loadSample(){
 feed.sample=true;const t=Date.now(),H=3600e3;
 [["Riverton Rovers","Eastgate United","Soccer","Sample League",-1.2],["Lakeside City","Northfield Town","Soccer","Sample League",3],["Cedar Hawks","Bay Breakers","Basketball","Sample Hoops",5],
  ["Summit Kings","Delta Dunkers","Basketball","Sample Hoops",26],["Polar Wolves","Iron Peaks","Ice Hockey","Sample Frost",29],["Port Sailors","Hillcrest Athletic","Soccer","Sample Cup",50]]
 .forEach((x,i)=>upsert({id:"sample"+i,home:x[0],away:x[1],sport:x[2],league:x[3],start:t+x[4]*H,hs:x[4]<0?1:null,as:x[4]<0?0:null,status:"",progress:"",hb:"",ab:""}));
}
async function loadOdds(){
 try{
  const keys=[...new Set(LEAGUES.map(l=>l.ok))];const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
  let n=0;
  await Promise.allSettled(keys.map(async k=>{
   const games=await getJSON(`https://api.the-odds-api.com/v4/sports/${k}/odds/?regions=uk&markets=h2h&oddsFormat=decimal&apiKey=${encodeURIComponent(CONFIG.ODDS_API_KEY)}`);
   games.forEach(g=>{
    const e=Object.values(EV).find(x=>norm(x.home)===norm(g.home_team)&&norm(x.away)===norm(g.away_team))||
            Object.values(EV).find(x=>norm(x.home).includes(norm(g.home_team))&&norm(x.away).includes(norm(g.away_team)));
    const bk=g.bookmakers&&g.bookmakers[0];const mk=bk&&bk.markets.find(m=>m.key==="h2h");if(!e||!mk)return;
    const o={};mk.outcomes.forEach(x=>{const nm=norm(x.name);if(nm===norm(g.home_team))o.H=x.price;else if(nm===norm(g.away_team))o.A=x.price;else if(nm==="draw")o.D=x.price});
    if(o.H&&o.A&&(!e.draw||o.D)){e.odds=o;e.src="feed";n++}
   });
  }));
  feed.odds=n?"feed ("+n+" matched)":"indicative";
 }catch(e){feed.odds="indicative"}
}

const pendingEvents=()=>[...new Set(S.bets.filter(b=>b.status==="pending").flatMap(b=>b.legs.map(l=>l.e)))].filter(id=>RES[id]===undefined);
async function checkResults(manual){
 const ids=pendingEvents().filter(id=>!String(id).startsWith("sample")&&EV[id]&&Date.now()>EV[id].start+60*60e3).slice(0,8);
 for(const id of ids){
  try{
   const j=await getJSON(`${TSDB}/lookupevent.php?id=${id}`);const p=parseEvent(j.events&&j.events[0]);if(!p)continue;
   upsert(p);const e=EV[id];
   if(isVoid(e))RES[id]="V";
   else if(isFinished(e)&&e.hs!==null&&e.as!==null){RES[id]=e.hs>e.as?"H":e.hs<e.as?"A":(e.draw?"D":"V")}
  }catch(err){}
 }
 S.bets.forEach(trySettle);
 renderHeader();if(S.view==="bets"||S.view==="wallet")renderView();
 if(manual)toast(ids.length?"Results checked.":"No bets are waiting on results.");
}
function trySettle(b){
 if(b.status!=="pending")return;
 if(b.legs.some(l=>RES[l.e]!==undefined&&RES[l.e]!=="V"&&RES[l.e]!==l.k)){b.status="lost";return}
 if(b.legs.some(l=>RES[l.e]===undefined))return;
 const live=b.legs.filter(l=>RES[l.e]!=="V");
 if(!live.length){b.status="void";b.paid=b.stake;S.bal+=b.stake;addTx({type:"Refund",amt:b.stake,method:"Void: "+b.legs.map(l=>l.pick).join(" + "),ref:ref("R")});return}
 b.status="won";b.paid=b.stake*live.reduce((a,l)=>a*l.odds,1);S.bal+=b.paid;
 addTx({type:"Win",amt:b.paid,method:b.legs.map(l=>l.pick).join(" + "),ref:ref("W")});toast("You won "+$$(b.paid)+"!");
}

const stakeOf=k=>Math.max(0,Math.round((Number(S.stakes[k])||0)*100)/100);
const px=s=>EV[s.e].odds[s.k];
function calc(){
 if(S.mode==="parlay"){const st=Math.max(0,Math.round((Number(S.pstake)||0)*100)/100),o=S.sel.reduce((a,s)=>a*px(s),1);return{stake:st,pay:S.sel.length>1?st*o:0,odds:o}}
 let st=0,pay=0;S.sel.forEach(s=>{const x=stakeOf(s.e);st+=x;pay+=x*px(s)});return{stake:st,pay}
}
function pickName(s){const e=EV[s.e];return s.k==="H"?e.home:s.k==="A"?e.away:"Draw"}
function renderSlip(){
 $("cnt").textContent=S.sel.length?`(${S.sel.length})`:"";
 $("m-single").setAttribute("aria-pressed",S.mode==="single");$("m-parlay").setAttribute("aria-pressed",S.mode==="parlay");$("parlayBox").hidden=S.mode!=="parlay";
 $("legs").innerHTML=S.sel.length?S.sel.map(s=>`<div class="leg"><div class="pick">${esc(pickName(s))}</div><button class="x" data-rm="${s.e}">Remove</button><div class="ev">${esc(EV[s.e].title)}</div><div class="px">${px(s).toFixed(2)}</div>
  ${S.mode==="single"?`<input type="number" min="1" inputmode="decimal" placeholder="Stake" aria-label="Stake for ${esc(pickName(s))}" data-st="${s.e}" value="${esc(S.stakes[s.e]||"")}">`:""}</div>`).join("")
  +(S.mode==="single"?`<div class="quick" data-q="s"><button data-add="5">+5</button><button data-add="20">+20</button><button data-add="50">+50</button></div>`:""):`<p class="empty">Tap any odds to add a pick.</p>`;

}
function updateTotals(){
 const c=calc();$("tot").textContent=$$(c.stake);$("pay").textContent=$$(c.pay);let m="",ok=true;
 if(!S.sel.length)ok=false;
 else if(S.cooloff){m="Cool-off is active. End it in Account to bet.";ok=false}
 else if(S.mode==="parlay"&&S.sel.length<2){m="A parlay needs at least 2 picks.";ok=false}
 else if(c.stake<1)ok=false;
 else if(S.mode==="single"&&S.sel.some(s=>stakeOf(s.e)<1)){m="Enter a stake of 1 or more on every pick.";ok=false}
 else if(c.stake>S.bal){m=CONFIG.PAYMENTS_ENABLED?"Not enough balance. Deposit to continue.":"Not enough free-play credits.";ok=false}
 $("err").textContent=m;$("place").disabled=!ok;$("place").textContent=S.mode==="parlay"?"Place parlay":S.sel.length>1?"Place bets":"Place bet";
}
function place(){
 pruneSlip();const c=calc();
 if(!S.sel.length){toast("Those matches have started. Pick again.");renderAll();return}
 if(c.stake>S.bal||S.cooloff)return;
 const leg=s=>({e:s.e,k:s.k,pick:pickName(s),title:EV[s.e].title,odds:px(s)});
 const mk=(type,stake,odds,legs)=>{S.bal-=stake;S.bets.push({id:S.nid++,type,stake,odds,pay:stake*odds,status:"pending",legs});addTx({type:"Bet",amt:-stake,method:legs.map(l=>l.pick).join(" + "),ref:ref("B")})};
 if(S.mode==="parlay")mk("parlay",c.stake,c.odds,S.sel.map(leg));else S.sel.forEach(s=>mk("single",stakeOf(s.e),px(s),[leg(s)]));
 S.sel=[];S.stakes={};S.pstake="";$("slip").classList.remove("open");$("toggle").textContent="Open";toast("Bet placed. Good luck!");renderAll();
}

 try{const r=await CONFIG.hooks.withdraw({amount:amt,method:S.wm,dest});S.bal-=amt;addTx({type:"Withdrawal",amt:-amt,status:"pending",method:S.wm,ref:r.ref});S.wtab="history";renderAll();
  openModal(`<div class="tick">✓</div><h3>Withdrawal requested</h3><div class="receipt"><div><span>Amount</span><b>${$$(amt)}</b></div><div><span>Reference</span><b>${esc(r.ref)}</b></div></div><button class="btn" data-close="1">Done</button>`);
 }catch(e){openModal(`<h3>Withdrawal failed</h3><p>${esc(e.message||"Please try again.")}</p><button class="btn" data-close="1">Close</button>`)}
}

/* ================= EVENTS ================= */
document.addEventListener("click",ev=>{
 const t=ev.target.closest("button,[role=button]");if(!t||t.disabled)return;const d=t.dataset;
 if(d.close){closeModal();return}
 if(d.v){S.view=d.v;renderAll();return}
 if(t.id==="hdep"){S.view="wallet";S.wtab="deposit";renderAll();return}
 if(t.id==="hbal"){S.view="wallet";renderAll();return}
 if(d.s!==undefined){S.filter=d.s;renderView();return}
 if(t.id==="refresh"){loadFixtures();return}
 if(t.classList.contains("odd")){
  const e=d.e,k=d.k,ex=S.sel.findIndex(s=>s.e===e);
  if(ex>-1&&S.sel[ex].k===k)S.sel.splice(ex,1);else if(ex>-1)S.sel[ex].k=k;else S.sel.push({e,k});
  document.querySelectorAll(`.odd[data-e="${e}"]`).forEach(b=>b.setAttribute("aria-pressed",S.sel.some(s=>s.e===e&&s.k===b.dataset.k)));renderSlip();return}
 if(d.rm){S.sel=S.sel.filter(s=>s.e!==d.rm);renderView();renderSlip();return}
 if(d.add!==undefined){const g=t.parentElement.dataset.q;
  if(g==="p"){S.pstake=d.add==="max"?String(Math.floor(S.bal*100)/100):String((Number(S.pstake)||0)+Number(d.add));$("pstake").value=S.pstake;updateTotals()}
  else{S.sel.forEach(s=>{S.stakes[s.e]=String((Number(S.stakes[s.e])||0)+Number(d.add))});renderSlip()}return}
 if(t.id==="chk"){checkResults(true);return}
 if(d.wt){S.wtab=d.wt;renderView();return}
 if(d.dm){S.dm=d.dm;renderView();return}if(d.wm){S.wm=d.wm;renderView();return}
 if(d.tf){S.txf=d.tf;renderView();return}
 if(d.wait){S.waitlist=true;toast("You're on the list. We'll email you when payments open.");renderView();return}
 if(t.id==="depgo"){doDeposit();return}if(t.id==="wdgo"){doWithdraw();return}
 if(t.id==="limgo"){const v=Number($("lim").value);if(v>=5){S.limit=v;toast("Daily limit saved")}else toast("Limit must be at least 5");return}
 if(t.id==="cool"){if(S.cooloff){S.cooloff=false;clearTimeout(S.ct);toast("Cool-off ended")}else{S.cooloff=true;S.ct=setTimeout(()=>{S.cooloff=false;toast("Cool-off over");if(S.view==="account")renderView();updateTotals()},60000);toast("Cool-off started for 1 minute")}renderView();updateTotals();return}
 if(t.id==="out"){logout();return}
 if(t.id==="m-single"){S.mode="single";renderSlip();return}if(t.id==="m-parlay"){S.mode="parlay";renderSlip();return}
 if(t.id==="place"){place();return}
 if(t.id==="toggle"||(t.closest(".slip-head")&&innerWidth<900)){const o=$("slip").classList.toggle("open");$("toggle").textContent=o?"Close":"Open";$("toggle").setAttribute("aria-expanded",o)}
});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.st){S.stakes[t.dataset.st]=t.value;updateTotals()}if(t.id==="pstake"){S.pstake=t.value;updateTotals()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="hbal"){S.view="wallet";renderAll()}if(e.key==="Escape")closeModal()});

/* ================= TIMERS ================= */
setInterval(()=>{if(!$("app").hidden)loadFixtures()},5*60e3);            // fixtures + odds every 5 min (stays under free rate limits)
setInterval(()=>{if(!$("app").hidden&&CONFIG.TSDB_V2_KEY)loadLive().then(rerender)},60e3); // live scores every minute (premium key)
setInterval(()=>{if(!$("app").hidden)checkResults(false)},90e3);          // settle bets from official results
setInterval(()=>{if(!$("app").hidden&&(S.view==="fixtures"||S.view==="live")){pruneSlip();rerender()}},30e3); // roll matches from upcoming to live
setAuth("up");
</script>
</body>
</html>
